<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration | ApexCare Hospital</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .register-page {
      min-height: calc(100vh - 65px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    }
    .register-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-xl);
      max-width: 650px;
      width: 100%;
      padding: 2.5rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand">
        <div class="brand-icon">+</div>
        <span>ApexCare Hospital</span>
      </a>
      <div class="nav-actions">
        <a href="/" class="btn btn-outline btn-sm">Home</a>
        <a href="/login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <div class="register-page">
    <div class="register-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.85rem; font-weight: 800; color: var(--primary-navy); margin-bottom: 0.35rem;">Patient Registration</h2>
        <p style="font-size: 0.95rem; color: var(--text-muted);">Create your patient account to book clinical appointments and view history</p>
      </div>

      <form id="register-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name *</label>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Aditi Sharma" required minlength="2">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address *</label>
            <input type="email" id="reg-email" class="form-control" placeholder="aditi.sharma@example.com" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number *</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-dob">Date of Birth</label>
            <input type="date" id="reg-dob" class="form-control">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-gender">Gender</label>
            <select id="reg-gender" class="form-control">
              <option value="Prefer not to say">Select gender...</option>
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-blood">Blood Group</label>
            <select id="reg-blood" class="form-control">
              <option value="Unknown">Select blood group...</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-address">Residential Address</label>
          <input type="text" id="reg-address" class="form-control" placeholder="Flat / House No., Street, City">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password *</label>
            <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password *</label>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-type password" required minlength="6">
          </div>
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-primary btn-full btn-lg" style="margin-top: 1.5rem;">
          Complete Registration & Proceed
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.92rem; color: var(--text-muted);">
        Already registered? <a href="/login.html" style="font-weight: 600;">Sign In here</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const dob = document.getElementById('reg-dob').value;
      const gender = document.getElementById('reg-gender').value;
      const bloodGroup = document.getElementById('reg-blood').value;
      const address = document.getElementById('reg-address').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;
      const submitBtn = document.getElementById('reg-submit-btn');

      if (password !== confirmPassword) {
        API.showToast('Passwords do not match. Please verify.', 'error');
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Registering patient account...';

        const res = await API.post('/api/auth/register', {
          name,
          email,
          phone,
          password,
          gender,
          dateOfBirth: dob || undefined,
          bloodGroup,
          address: address || undefined
        });

        API.setToken(res.token);
        API.setUser(res.user);
        API.showToast('Registration successful! Welcome to ApexCare.', 'success');

        setTimeout(() => {
          window.location.href = '/patient-dashboard.html';
        }, 1200);
      } catch (err) {
        API.showToast(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Complete Registration & Proceed';
      }
    });
  </script>
</body>
</html>
