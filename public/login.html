<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ApexCare Hospital Portal</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .auth-page {
      min-height: calc(100vh - 65px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    }
    .auth-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-xl);
      max-width: 480px;
      width: 100%;
      padding: 2.5rem;
    }
    .role-tabs {
      display: flex;
      background-color: #f1f5f9;
      border-radius: var(--radius-md);
      padding: 0.25rem;
      margin-bottom: 1.75rem;
      gap: 0.25rem;
    }
    .role-tab {
      flex: 1;
      padding: 0.6rem;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-muted);
      border: none;
      background: none;
      transition: var(--transition);
    }
    .role-tab.active {
      background-color: #ffffff;
      color: var(--primary-navy);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand">
        <div class="brand-icon">+</div>
        <span>ApexCare Hospital</span>
      </a>
      <div class="nav-actions">
        <a href="/" class="btn btn-outline btn-sm">Home</a>
        <a href="/register.html" class="btn btn-primary btn-sm">Register</a>
      </div>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--primary-navy); margin-bottom: 0;">Portal Sign In</h2>
      </div>

      <!-- Role Selector Tabs -->
      <div class="role-tabs">
        <button type="button" class="role-tab active" data-role="patient" onclick="setRole('patient')">Patient</button>
        <button type="button" class="role-tab" data-role="doctor" onclick="setRole('doctor')">Doctor</button>
        <button type="button" class="role-tab" data-role="admin" onclick="setRole('admin')">Administrator</button>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-full" style="margin-top: 1.5rem;">
          Sign In to Portal
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="/register.html" style="font-weight: 600;">Register as Patient</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    let currentRole = 'patient';

    function setRole(role) {
      currentRole = role;
      document.querySelectorAll('.role-tab').forEach(tab => {
        if (tab.dataset.role === role) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const submitBtn = document.getElementById('login-submit-btn');

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Verifying credentials...';

        const res = await API.post('/api/auth/login', {
          email,
          password,
          role: currentRole
        });

        API.setToken(res.token);
        API.setUser(res.user);
        API.showToast(`Welcome back, ${res.user.name}! Redirecting...`, 'success');

        setTimeout(() => {
          // Check query redirect
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect');

          if (redirect) {
            window.location.href = redirect;
          } else if (res.user.role === 'patient') {
            window.location.href = '/patient-dashboard.html';
          } else if (res.user.role === 'doctor') {
            window.location.href = '/doctor-dashboard.html';
          } else if (res.user.role === 'admin') {
            window.location.href = '/admin-dashboard.html';
          }
        }, 1000);
      } catch (err) {
        API.showToast(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Portal';
      }
    });
  </script>
</body>
</html>
